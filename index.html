<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Antigravity — Free privacy tool to request data deletion from 180+ data brokers. Track opt-outs, generate CCPA/GDPR requests, and take control of your personal information." />
    <meta name="theme-color" content="#060606" />
    <meta property="og:title" content="Antigravity | Data Broker Removal Agent" />
    <meta property="og:description" content="Privacy control center. Generate deletion requests for 180+ data brokers under CCPA, GDPR and state privacy laws." />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index, follow" />
    
    <title>Antigravity — Data Broker Removal Agent</title>
    
    <!-- Preconnect for faster Google Fonts (Cloudflare edge will also cache) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Critical fallback styles (prevents FOUC) -->
    <style>
      body { 
        margin: 0; 
        background: #060606; 
        color: #fff; 
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback loading indicator shown if JavaScript fails to load or execute.
           This helps diagnose black screen issues on static hosting like Cloudflare Pages. -->
      <div style="
        min-height: 100vh;
        background: #060606;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 20px;
      ">
        <div>
          <div style="
            width: 48px;
            height: 48px;
            margin: 0 auto 20px;
            border: 3px solid #3b82f6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
          "></div>
          <div style="font-size: 14px; font-weight: 600; letter-spacing: 1px; opacity: 0.8;">
            LOADING ANTIGRAVITY...
          </div>
          <div style="margin-top: 12px; font-size: 12px; opacity: 0.5;">
            If this stays here, open DevTools Console (F12) for errors.
          </div>
        </div>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
