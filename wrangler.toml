# wrangler.toml
# Configuration for Cloudflare Pages + Wrangler

name = "antigravity-data-broker-removal"
compatibility_date = "2025-05-01"

# This is the key setting Cloudflare Pages needs when it detects wrangler.toml
pages_build_output_dir = "dist"

# You can still deploy manually with:
#   npm run build && npx wrangler pages deploy dist
